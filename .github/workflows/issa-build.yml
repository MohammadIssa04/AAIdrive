name: issa-build

# Builds the Issa version of AAIdrive (cover screen, arrows) as a debug APK.
# The APK is re-signed with the Issa key afterwards, outside of GitHub.
on:
  push:
    branches: ['issa']
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Fetch upstream tags for the version name
        run: git fetch --tags https://github.com/BimmerGestalt/AAIdrive.git || true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
      - name: Prepare cached external dependencies
        uses: actions/cache@v4
        with:
          key: aaidrive_external_${{ hashFiles('.github/actions/download-externals-action/download.sh') }}
          path: |
            external
      - name: Download build dependencies
        uses: ./.github/actions/download-externals-action
      - name: Build the APK
        run: ./gradlew assembleNomapNonalyticsFullDebug --stacktrace
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: aaidrive-issa
          path: app/build/outputs/apk/nomapNonalyticsFull/debug/*.apk
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/nomapNonalyticsFull/debug/*.apk aaidrive-issa.apk
          gh release create "issa-${{ github.run_number }}" aaidrive-issa.apk --prerelease \
            --target "${{ github.sha }}" --title "AAIdrive Issa build ${{ github.run_number }}" \
            --notes "Debug build of ${{ github.sha }} – re-signed with the Issa key before installing."
