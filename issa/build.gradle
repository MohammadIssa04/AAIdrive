// Issa Music, as a library: the whole app (screens, player service, TV page, car helpers).
// The :app module (AAIdrive's build) pulls it in and is what gets installed.
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.musik.app'
    compileSdk 35

    defaultConfig {
        minSdk 26
        // the app's update check compares against these (the app module gets the same numbers)
        buildConfigField 'int', 'VERSION_CODE', "${rootProject.ext.issaVersionCode}"
        buildConfigField 'String', 'VERSION_NAME', "\"${rootProject.ext.issaVersionName}\""
        consumerProguardFiles 'consumer-rules.pro'
        // the home server's address is not kept in the source: it comes from -PissaHost (the ISSA_HOST variable of the repository)
        def issaHost = (project.findProperty('issaHost') ?: '').toString().trim()
        buildConfigField 'String', 'DEFAULT_HOST', "\"${issaHost ? issaHost : '192.0.2.1'}\""
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation platform('androidx.compose:compose-bom:2024.09.02')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'androidx.palette:palette-ktx:1.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.profileinstaller:profileinstaller:1.3.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.8.1'
}
